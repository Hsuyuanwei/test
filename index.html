<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五子棋 (Gomoku - 強化連線版)</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #333; margin-bottom: 10px; }
        .network-panel {
            background: #fff;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 410px;
        }
        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        input[type="text"] {
            padding: 6px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.95rem;
            flex: 1;
        }
        button {
            padding: 7px 14px;
            font-size: 0.95rem;
            background-color: #5c4033;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            white-space: nowrap;
        }
        button:hover { background-color: #3e2b22; }
        button:disabled { background-color: #aaa; cursor: not-allowed; }
        #status {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #444;
        }
        #roleInfo {
            font-size: 0.95rem;
            color: #0066cc;
            font-weight: bold;
        }
        #debugLog {
            font-size: 0.8rem;
            color: #666;
            background: #eee;
            padding: 6px 10px;
            border-radius: 4px;
            max-height: 60px;
            overflow-y: auto;
            font-family: monospace;
        }
        canvas {
            background-color: #deb887;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h1>五子棋（強化連線版）</h1>

    <div class="network-panel">
        <div class="row">
            <span>你的房間 ID：</span>
            <input type="text" id="myIdInput" readonly value="正在連線伺服器...">
            <button onclick="copyId()">複製</button>
        </div>
        <div class="row">
            <input type="text" id="remoteIdInput" placeholder="貼上對手的房間 ID">
            <button id="connectBtn" onclick="connectToPeer()">加入對戰</button>
        </div>
        <div id="roleInfo">連線狀態：等待配對</div>
        <div id="debugLog">系統日誌：初始化中...</div>
    </div>

    <div id="status">目前回合：黑棋</div>
    <canvas id="board" width="450" height="450"></canvas>
    <div style="margin-top: 15px;">
        <button onclick="requestReset()">重新開始</button>
    </div>

    <script>
        const canvas = document.getElementById('board');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');
        const roleInfoEl = document.getElementById('roleInfo');
        const debugLogEl = document.getElementById('debugLog');
        const myIdInput = document.getElementById('myIdInput');
        const remoteIdInput = document.getElementById('remoteIdInput');
        const connectBtn = document.getElementById('connectBtn');

        function log(msg) {
            debugLogEl.innerHTML += `<br>> ${msg}`;
            debugLogEl.scrollTop = debugLogEl.scrollHeight;
        }

        let gameData = {
            "config": {
                "boardSize": 15,
                "cellSize": 30,
                "padding": 15,
                "stars": [
                    { "r": 3, "c": 3 }, { "r": 3, "c": 7 }, { "r": 3, "c": 11 },
                    { "r": 7, "c": 3 }, { "r": 7, "c": 7 }, { "r": 7, "c": 11 },
                    { "r": 11, "c": 3 }, { "r": 11, "c": 7 }, { "r": 11, "c": 11 }
                ]
            },
            "state": {
                "currentPlayer": 1,
                "gameOver": false,
                "winLine": null,
                "grid": []
            }
        };

        let peer = null;
        let conn = null;
        let myRole = 0;

        // 1. 初始化 PeerJS（加入 STUN + 免費公共 TURN 伺服器穿透防火牆）
        function initPeer() {
            // 產生較短的 6 碼隨機房間 ID，方便手動輸入
            const shortId = 'gomoku-' + Math.random().toString(36).substring(2, 8);

            peer = new Peer(shortId, {
                debug: 2,
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        {
                            urls: 'turn:openrelay.metered.ca:80',
                            username: 'openrelayproject',
                            credential: 'openrelayproject'
                        },
                        {
                            urls: 'turn:openrelay.metered.ca:443',
                            username: 'openrelayproject',
                            credential: 'openrelayproject'
                        }
                    ]
                }
            });

            peer.on('open', (id) => {
                myIdInput.value = id;
                log("已連線至配對伺服器，ID 就緒");
            });

            peer.on('connection', (connection) => {
                log("收到來自對手的連線請求...");
                if (conn && conn.open) {
                    connection.close();
                    return;
                }
                conn = connection;
                myRole = 1;
                setupConnectionEvents();
            });

            peer.on('disconnected', () => {
                log("與配對伺服器斷線，嘗試重連...");
                peer.reconnect();
            });

            peer.on('error', (err) => {
                log("錯誤：" + err.type + " (" + err.message + ")");
                connectBtn.disabled = false;
            });
        }

        // 2. 主動連線
        function connectToPeer() {
            const remoteId = remoteIdInput.value.trim();
            if (!remoteId) return alert("請先輸入對手的房間 ID！");
            if (remoteId === myIdInput.value) return alert("不能連線給自己喔！");

            log("正在嘗試連線至：" + remoteId);
            roleInfoEl.textContent = "連線狀態：正在建立通道（約需 3~5 秒）...";
            connectBtn.disabled = true;

            // 強制使用 reliable: true 確保 JSON 封包不遺失
            conn = peer.connect(remoteId, { reliable: true });
            myRole = 2;
            setupConnectionEvents();

            // 設定 10 秒超時檢查
            setTimeout(() => {
                if (conn && !conn.open) {
                    log("連線超時！可能是網路防火牆阻擋或 ID 輸入錯誤。");
                    roleInfoEl.textContent = "連線狀態：連線超時，請重試";
                    connectBtn.disabled = false;
                }
            }, 10000);
        }

        // 3. 監聽資料通道事件
        function setupConnectionEvents() {
            const onConnected = () => {
                log("P2P 資料通道已成功開啟！");
                if (myRole === 1) {
                    roleInfoEl.textContent = "連線成功！你是【黑棋（先手）】";
                    roleInfoEl.style.color = "#28a745";
                } else if (myRole === 2) {
                    roleInfoEl.textContent = "連線成功！你是【白棋（後手）】";
                    roleInfoEl.style.color = "#28a745";
                    conn.send({ type: 'HELLO' });
                }
                connectBtn.disabled = true;
                initGame();
            };

            if (conn.open) {
                onConnected();
            } else {
                conn.on('open', onConnected);
            }

            conn.on('data', (data) => {
                if (data.type === 'HELLO') {
                    log("收到對手握手確認！");
                    roleInfoEl.textContent = "連線成功！你是【黑棋（先手）】";
                    roleInfoEl.style.color = "#28a745";
                    connectBtn.disabled = true;
                    initGame();
                } else if (data.type === 'SYNC_STATE') {
                    gameData.state = data.state;
                    drawBoard();
                    updateStatusText();
                } else if (data.type === 'RESET') {
                    initGame();
                }
            });

            conn.on('close', () => {
                log("連線已關閉");
                roleInfoEl.textContent = "連線狀態：對手已離線";
                roleInfoEl.style.color = "#d9534f";
                myRole = 0;
                connectBtn.disabled = false;
            });

            conn.on('error', (err) => {
                log("通道錯誤：" + err);
            });
        }

        function copyId() {
            myIdInput.select();
            navigator.clipboard.writeText(myIdInput.value).then(() => {
                alert("已複製房間 ID：" + myIdInput.value);
            }).catch(() => {
                document.execCommand('copy');
                alert("已複製房間 ID！");
            });
        }

        function initGame() {
            const size = gameData.config.boardSize;
            gameData.state.grid = Array.from({ length: size }, () => Array(size).fill(0));
            gameData.state.currentPlayer = 1;
            gameData.state.gameOver = false;
            gameData.state.winLine = null;

            drawBoard();
            updateStatusText();
        }

        function updateStatusText() {
            const { currentPlayer, gameOver } = gameData.state;
            if (gameOver) {
                statusEl.textContent = (currentPlayer === 1 ? "黑棋" : "白棋") + " 獲勝！";
                statusEl.style.color = "#d9534f";
            } else {
                let turnText = "目前回合：" + (currentPlayer === 1 ? "黑棋" : "白棋");
                if (myRole !== 0) {
                    turnText += (currentPlayer === myRole) ? "（輪到你了！）" : "（等待對手...）";
                }
                statusEl.textContent = turnText;
                statusEl.style.color = "#444";
            }
        }

        function drawBoard() {
            const { boardSize, cellSize, padding, stars } = gameData.config;
            const { grid, winLine } = gameData.state;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "#333";
            ctx.lineWidth = 1;

            for (let i = 0; i < boardSize; i++) {
                ctx.beginPath();
                ctx.moveTo(padding, padding + i * cellSize);
                ctx.lineTo(canvas.width - padding, padding + i * cellSize);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(padding + i * cellSize, padding);
                ctx.lineTo(padding + i * cellSize, canvas.height - padding);
                ctx.stroke();
            }

            ctx.fillStyle = "#333";
            for (let star of stars) {
                ctx.beginPath();
                ctx.arc(padding + star.c * cellSize, padding + star.r * cellSize, 3, 0, Math.PI * 2);
                ctx.fill();
            }

            for (let r = 0; r < boardSize; r++) {
                for (let c = 0; c < boardSize; c++) {
                    if (grid[r][c] !== 0) {
                        drawPiece(r, c, grid[r][c]);
                    }
                }
            }

            if (winLine) drawWinLine(winLine);
        }

        function drawPiece(row, col, player) {
            const { cellSize, padding } = gameData.config;
            const x = padding + col * cellSize;
            const y = padding + row * cellSize;
            const radius = cellSize / 2 - 2;

            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);

            const gradient = ctx.createRadialGradient(x - 3, y - 3, 2, x, y, radius);
            if (player === 1) {
                gradient.addColorStop(0, "#666");
                gradient.addColorStop(1, "#000");
            } else {
                gradient.addColorStop(0, "#fff");
                gradient.addColorStop(1, "#ccc");
            }

            ctx.fillStyle = gradient;
            ctx.fill();
        }

        function drawWinLine(winLine) {
            const { cellSize, padding } = gameData.config;
            winLine.sort((a, b) => (a.r - b.r) || (a.c - b.c));

            const start = winLine[0];
            const end = winLine[winLine.length - 1];

            ctx.beginPath();
            ctx.moveTo(padding + start.c * cellSize, padding + start.r * cellSize);
            ctx.lineTo(padding + end.c * cellSize, padding + end.r * cellSize);
            ctx.strokeStyle = "#e63946";
            ctx.lineWidth = 4;
            ctx.lineCap = "round";
            ctx.stroke();
        }

        canvas.addEventListener('click', (e) => {
            if (gameData.state.gameOver) return;
            if (myRole !== 0 && gameData.state.currentPlayer !== myRole) return;

            const { boardSize, cellSize, padding } = gameData.config;
            const rect = canvas.getBoundingClientRect();
            const col = Math.round((e.clientX - rect.left - padding) / cellSize);
            const row = Math.round((e.clientY - rect.top - padding) / cellSize);

            if (row >= 0 && row < boardSize && col >= 0 && col < boardSize && gameData.state.grid[row][col] === 0) {
                const player = gameData.state.currentPlayer;
                gameData.state.grid[row][col] = player;

                const winLine = checkWin(row, col, player);

                if (winLine) {
                    gameData.state.winLine = winLine;
                    gameData.state.gameOver = true;
                } else {
                    gameData.state.currentPlayer = player === 1 ? 2 : 1;
                }

                drawBoard();
                updateStatusText();

                if (conn && conn.open) {
                    conn.send({
                        type: 'SYNC_STATE',
                        state: gameData.state
                    });
                }
            }
        });

        function checkWin(row, col, player) {
            const { boardSize } = gameData.config;
            const { grid } = gameData.state;
            const directions = [[0, 1], [1, 0], [1, 1], [1, -1]];

            for (let [dr, dc] of directions) {
                let line = [{ r: row, c: col }];

                for (let i = 1; i < 5; i++) {
                    const r = row + dr * i, c = col + dc * i;
                    if (r >= 0 && r < boardSize && c >= 0 && c < boardSize && grid[r][c] === player) {
                        line.push({ r, c });
                    } else break;
                }

                for (let i = 1; i < 5; i++) {
                    const r = row - dr * i, c = col - dc * i;
                    if (r >= 0 && r < boardSize && c >= 0 && c < boardSize && grid[r][c] === player) {
                        line.push({ r, c });
                    } else break;
                }

                if (line.length >= 5) return line;
            }
            return null;
        }

        function requestReset() {
            initGame();
            if (conn && conn.open) {
                conn.send({ type: 'RESET' });
            }
        }

        initGame();
        initPeer();
    </script>
</body>
</html>
