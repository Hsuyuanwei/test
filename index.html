<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五子棋 (Gomoku - 雲端頻道連線版)</title>
    <!-- 引入 MQTT.js 透過 WebSocket 進行穩定連線 -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #333; margin-bottom: 10px; }
        .network-panel {
            background: #fff;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 410px;
        }
        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        input[type="text"] {
            padding: 6px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.95rem;
            flex: 1;
        }
        button {
            padding: 7px 14px;
            font-size: 0.95rem;
            background-color: #5c4033;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            white-space: nowrap;
        }
        button:hover { background-color: #3e2b22; }
        button:disabled { background-color: #aaa; cursor: not-allowed; }
        #status {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #444;
        }
        #roleInfo {
            font-size: 0.95rem;
            color: #0066cc;
            font-weight: bold;
        }
        canvas {
            background-color: #deb887;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h1>五子棋（雲端頻道連線版）</h1>

    <div class="network-panel">
        <div class="row">
            <span>自訂房間暗號：</span>
            <input type="text" id="roomInput" placeholder="例如：8888 或 myroom">
            <button id="createBtn" onclick="joinRoom(1)">開房(黑棋)</button>
            <button id="joinBtn" onclick="joinRoom(2)">加入(白棋)</button>
        </div>
        <div id="roleInfo">連線狀態：請輸入相同的「房間暗號」並選擇黑棋或白棋</div>
    </div>

    <div id="status">目前回合：黑棋</div>
    <canvas id="board" width="450" height="450"></canvas>
    <div style="margin-top: 15px;">
        <button onclick="requestReset()">重新開始</button>
    </div>

    <script>
        const canvas = document.getElementById('board');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');
        const roleInfoEl = document.getElementById('roleInfo');
        const roomInput = document.getElementById('roomInput');
        const createBtn = document.getElementById('createBtn');
        const joinBtn = document.getElementById('joinBtn');

        // 預設產生一個 4 位數隨機房號方便測試
        roomInput.value = Math.floor(1000 + Math.random() * 9000);

        let gameData = {
            "config": {
                "boardSize": 15,
                "cellSize": 30,
                "padding": 15,
                "stars": [
                    { "r": 3, "c": 3 }, { "r": 3, "c": 7 }, { "r": 3, "c": 11 },
                    { "r": 7, "c": 3 }, { "r": 7, "c": 7 }, { "r": 7, "c": 11 },
                    { "r": 11, "c": 3 }, { "r": 11, "c": 7 }, { "r": 11, "c": 11 }
                ]
            },
            "state": {
                "currentPlayer": 1,
                "gameOver": false,
                "winLine": null,
                "grid": []
            }
        };

        let client = null;
        let currentTopic = "";
        let myRole = 0; // 0: 單機, 1: 黑棋, 2: 白棋
        const myClientId = "gomoku_player_" + Math.random().toString(16).substring(2, 10);

        // 加入指定房間頻道
        function joinRoom(role) {
            const roomCode = roomInput.value.trim();
            if (!roomCode) return alert("請輸入房間暗號！");

            myRole = role;
            currentTopic = `tw/gomoku/game/room_${roomCode}`;
            
            roleInfoEl.textContent = "連線狀態：正在連入雲端房間...";
            roleInfoEl.style.color = "#0066cc";
            createBtn.disabled = true;
            joinBtn.disabled = true;
            roomInput.disabled = true;

            // 連線到 EMQX 免費公共 WebSocket MQTT 伺服器（支援加密 WSS，穿透力極強）
            client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
                clientId: myClientId,
                clean: true,
                connectTimeout: 5000
            });

            client.on('connect', () => {
                // 訂閱該房間頻道
                client.subscribe(currentTopic, (err) => {
                    if (!err) {
                        const roleName = myRole === 1 ? "【黑棋（先手）】" : "【白棋（後手）】";
                        roleInfoEl.textContent = `已進入房間 [${roomCode}]！你是 ${roleName}`;
                        roleInfoEl.style.color = "#28a745";
                        initGame();
                        
                        // 廣播通知對手自己已進入房間
                        sendMessage({ type: 'JOIN', role: myRole });
                    }
                });
            });

            // 收到頻道內的 JSON 訊息
            client.on('message', (topic, message) => {
                try {
                    const data = JSON.parse(message.toString());
                    // 忽略自己發出去的訊息
                    if (data.sender === myClientId) return;

                    if (data.type === 'JOIN') {
                        const oppName = data.role === 1 ? "黑棋" : "白棋";
                        roleInfoEl.textContent += ` ｜ 對手（${oppName}）已就位！`;
                        // 如果是房主，同步一次目前棋盤給剛進來的對手
                        if (myRole === 1) {
                            sendMessage({ type: 'SYNC_STATE', state: gameData.state });
                        }
                    } else if (data.type === 'SYNC_STATE') {
                        gameData.state = data.state;
                        drawBoard();
                        updateStatusText();
                    } else if (data.type === 'RESET') {
                        initGame();
                    }
                } catch (e) {
                    console.error("解析訊息失敗", e);
                }
            });

            client.on('error', (err) => {
                alert("連線伺服器失敗，請檢查網路狀態！");
                createBtn.disabled = false;
                joinBtn.disabled = false;
                roomInput.disabled = false;
            });
        }

        // 發送 JSON 資料到房間頻道
        function sendMessage(payload) {
            if (client && client.connected && currentTopic) {
                payload.sender = myClientId;
                client.publish(currentTopic, JSON.stringify(payload));
            }
        }

        function initGame() {
            const size = gameData.config.boardSize;
            gameData.state.grid = Array.from({ length: size }, () => Array(size).fill(0));
            gameData.state.currentPlayer = 1;
            gameData.state.gameOver = false;
            gameData.state.winLine = null;

            drawBoard();
            updateStatusText();
        }

        function updateStatusText() {
            const { currentPlayer, gameOver } = gameData.state;
            if (gameOver) {
                statusEl.textContent = (currentPlayer === 1 ? "黑棋" : "白棋") + " 獲勝！";
                statusEl.style.color = "#d9534f";
            } else {
                let turnText = "目前回合：" + (currentPlayer === 1 ? "黑棋" : "白棋");
                if (myRole !== 0) {
                    turnText += (currentPlayer === myRole) ? "（輪到你了！）" : "（等待對手...）";
                }
                statusEl.textContent = turnText;
                statusEl.style.color = "#444";
            }
        }

        function drawBoard() {
            const { boardSize, cellSize, padding, stars } = gameData.config;
            const { grid, winLine } = gameData.state;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "#333";
            ctx.lineWidth = 1;

            for (let i = 0; i < boardSize; i++) {
                ctx.beginPath();
                ctx.moveTo(padding, padding + i * cellSize);
                ctx.lineTo(canvas.width - padding, padding + i * cellSize);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(padding + i * cellSize, padding);
                ctx.lineTo(padding + i * cellSize, canvas.height - padding);
                ctx.stroke();
            }

            ctx.fillStyle = "#333";
            for (let star of stars) {
                ctx.beginPath();
                ctx.arc(padding + star.c * cellSize, padding + star.r * cellSize, 3, 0, Math.PI * 2);
                ctx.fill();
            }

            for (let r = 0; r < boardSize; r++) {
                for (let c = 0; c < boardSize; c++) {
                    if (grid[r][c] !== 0) {
                        drawPiece(r, c, grid[r][c]);
                    }
                }
            }

            if (winLine) drawWinLine(winLine);
        }

        function drawPiece(row, col, player) {
            const { cellSize, padding } = gameData.config;
            const x = padding + col * cellSize;
            const y = padding + row * cellSize;
            const radius = cellSize / 2 - 2;

            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);

            const gradient = ctx.createRadialGradient(x - 3, y - 3, 2, x, y, radius);
            if (player === 1) {
                gradient.addColorStop(0, "#666");
                gradient.addColorStop(1, "#000");
            } else {
                gradient.addColorStop(0, "#fff");
                gradient.addColorStop(1, "#ccc");
            }

            ctx.fillStyle = gradient;
            ctx.fill();
        }

        function drawWinLine(winLine) {
            const { cellSize, padding } = gameData.config;
            winLine.sort((a, b) => (a.r - b.r) || (a.c - b.c));

            const start = winLine[0];
            const end = winLine[winLine.length - 1];

            ctx.beginPath();
            ctx.moveTo(padding + start.c * cellSize, padding + start.r * cellSize);
            ctx.lineTo(padding + end.c * cellSize, padding + end.r * cellSize);
            ctx.strokeStyle = "#e63946";
            ctx.lineWidth = 4;
            ctx.lineCap = "round";
            ctx.stroke();
        }

        canvas.addEventListener('click', (e) => {
            if (gameData.state.gameOver) return;
            if (myRole !== 0 && gameData.state.currentPlayer !== myRole) return;

            const { boardSize, cellSize, padding } = gameData.config;
            const rect = canvas.getBoundingClientRect();
            const col = Math.round((e.clientX - rect.left - padding) / cellSize);
            const row = Math.round((e.clientY - rect.top - padding) / cellSize);

            if (row >= 0 && row < boardSize && col >= 0 && col < boardSize && gameData.state.grid[row][col] === 0) {
                const player = gameData.state.currentPlayer;
                gameData.state.grid[row][col] = player;

                const winLine = checkWin(row, col, player);

                if (winLine) {
                    gameData.state.winLine = winLine;
                    gameData.state.gameOver = true;
                } else {
                    gameData.state.currentPlayer = player === 1 ? 2 : 1;
                }

                drawBoard();
                updateStatusText();

                // 將最新 JSON 狀態廣播給房間內的對手
                sendMessage({
                    type: 'SYNC_STATE',
                    state: gameData.state
                });
            }
        });

        function checkWin(row, col, player) {
            const { boardSize } = gameData.config;
            const { grid } = gameData.state;
            const directions = [[0, 1], [1, 0], [1, 1], [1, -1]];

            for (let [dr, dc] of directions) {
                let line = [{ r: row, c: col }];

                for (let i = 1; i < 5; i++) {
                    const r = row + dr * i, c = col + dc * i;
                    if (r >= 0 && r < boardSize && c >= 0 && c < boardSize && grid[r][c] === player) {
                        line.push({ r, c });
                    } else break;
                }

                for (let i = 1; i < 5; i++) {
                    const r = row - dr * i, c = col - dc * i;
                    if (r >= 0 && r < boardSize && c >= 0 && c < boardSize && grid[r][c] === player) {
                        line.push({ r, c });
                    } else break;
                }

                if (line.length >= 5) return line;
            }
            return null;
        }

        function requestReset() {
            initGame();
            sendMessage({ type: 'RESET' });
        }

        initGame();
    </script>
</body>
</html>
